# SAMPLE. scratch.db only. Candidate claims, none verified.
# STRESS: cover title at the maximum legal length (seven words), 12 slides.

post:
  id: sample-28-source-of-sin
  pillar: fact_panel
  running_head: an argument with three branches and one conclusion
  cover_title: a boy answers a question about sin
  cover_image: met-447809
  ink: iron
  caption: 'A man on the road asks a boy where sin comes from. The boy gives him
    a

    three-part disjunction, eliminates two branches, and keeps the third. Then

    he gives his name: Musa b. Ja''far.


    Tuhaf al-''Uqul preserves the argument in the questioner''s own voice.

    '
claims:
- subject: Musa b. Ja'far
  assertion: 'asked about the source of acts of disobedience, he answered that the
    source of any sin is one of three: God, God and the servant together, or the
    servant'
  source: SRC-TUH-001
  page: '126'
- subject: Musa b. Ja'far
  assertion: the questioner reports that he left before meeting Abu 'Abd Allah,
    because the answer had been enough for him
  source: SRC-TUH-001
  page: '126'
slides:
- template: cover
- template: question
  body: What does an argument look like when the person making it is a child?
- template: body
  body: 'The report comes to us from the man who lost it. He is on his way to see
    Abu ''Abd Allah Ja''far, he meets a boy, and something the boy says stops him.
    He asks the boy''s name and gets a lineage back: Musa b. Ja''far b. Muhammad
    b. ''Ali b. al-Husayn b. ''Ali b. Abi Talib. Then he asks the question he had
    been carrying, about where acts of disobedience come from.'
- template: body
  body: 'The answer arrives as a disjunction with three branches. The source of
    any sin, the boy says, is one of three: God, or God and the servant together,
    or the servant alone. Nothing has been argued yet. The move is to close the
    space first, so that whatever follows has nowhere else to go, and a listener
    who accepts the three has already accepted the shape.'
- template: body
  body: Branch one goes first. If God is the source, the boy says, then it is improper
    for him to punish servants for what they did not commit. That is an argument
    from the character of the punisher rather than from the mechanics of the act.
    It rests on something the questioner already holds, which is that the punishment
    is just.
- template: body
  body: 'Branch two goes next, and its reasoning changes register. If God and the
    servant are partners in the act, then it is improper for the stronger partner
    to wrong the weaker. Now the vocabulary is contract law: two parties, unequal
    power, an obligation on the stronger one. The argument has moved from theology
    to partnership without announcing the move. Partnership language brings its
    own obligations, and the boy is using them against the second branch rather
    than against the first.'
- template: body
  body: Branch three is left standing, and the boy takes it. If the servant is the
    source, then the Lord may pardon out of generosity or may punish for what was
    committed. Notice that the conclusion does not claim the servant acts alone
    in the world. It claims only that the servant is where the responsibility sits
    when a punishment is handed down.
- template: body
  body: 'That is a narrow conclusion, placed with care, and the narrowness is what
    makes the argument survive contact with an opponent. A wider claim about human
    freedom would have to answer questions about power and knowledge that the three
    branches never raise. [[NEEDS CLAIM: which theological school this argument
    is answering, and the source that identifies it]]. He declines to raise them.
    That restraint is what keeps the conclusion standing when somebody pushes back
    on it.'
- template: body
  body: The questioner's reaction is the second half of the report. He says the
    wording was enough for him, and that he turned back without going on to meet
    the father at all. A man who abandons the errand he set out on is reporting
    a defeat. Reports of that shape survive because the person who lost the exchange
    chose to keep telling it.
- template: body
  body: 'Which is worth holding onto when reading anything in a collection like
    this. The chain runs through the man who was answered. [[NEEDS CLAIM: the full
    chain al-Harrani gives for this report, Tuhaf p. 126]]. If the chain begins
    with him, the story is a self-report of being outargued, and that is a different
    kind of evidence from a partisan writing up his own side.'
- template: body
  body: 'The age of the speaker is doing rhetorical work and should be named as
    such. A child producing a formal disjunction is a topos, and topoi travel well
    because they are satisfying to retell. [[NEEDS CLAIM: whether any earlier source
    carries the same three-branch argument, attributed to anybody]]. If the argument
    predates the attribution, the report tells us about transmission rather than
    about a boy. Topoi travel because they are satisfying to retell. Test the topos
    anyway, because a satisfying story is the kind that gets attached to a famous
    name later.'
- template: body
  body: None of that makes the argument worse as an argument, and this account keeps
    the two questions apart on purpose. Whether the reasoning holds is a matter
    anybody can test on the page in front of them. Whether a particular person said
    it at a particular age is a matter for chains, dates and rijal, and the two
    questions have different answers. One question is settled by reading. This shelf
    holds neither the rijal literature nor the dictionaries, so the second question
    stays open here while the first can be settled by anyone with the page.
- template: closing
  body: The man who wrote this down had ridden out to ask a scholar a question,
    and he went home because a child had closed it.

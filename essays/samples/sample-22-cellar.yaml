# SAMPLE. scratch.db only. Candidate claims, none verified.
# STRESS: 13 slides, indigo, a modern devotional source read as a source.

post:
  id: sample-22-cellar
  pillar: collision
  running_head: what a modern book denies, and who it is answering
  cover_title: not from the cellar
  cover_image: met-449211
  ink: indigo
  caption: 'Al-Qarashi''s book on the twelfth Imam spends a paragraph denying something

    its own community is accused of holding: that the reappearance comes from

    the cellar at Samarra. A denial tells you what the accusation was.

    '
claims:
- subject: al-Qarashi
  assertion: writes that Shias have clearly announced, and continue to announce,
    that the reappearance of the Master of the Age will not be from the cellar of
    Samarra, but from Mecca
  source: SRC-QAR-002
  page: '19'
- subject: al-Qarashi
  assertion: compares the disappearance to the Prophet leaving Mecca for Yathrib
    while surrounded, with 'Ali sleeping in his bed
  source: SRC-QAR-002
  page: '19'
slides:
- template: cover
- template: question
  body: Why would a book spend a paragraph denying a belief nobody in it holds?
- template: body
  body: Al-Qarashi's volume on the twelfth Imam stops mid-argument to deny a specific
    claim. Shias have announced, and go on announcing, that the reappearance of
    the Master of the Age will not be from the cellar of Samarra. The place, he
    writes, is Mecca. Nothing in the paragraph explains who said otherwise, and
    the denial is written as though every reader already knows.
- template: body
  body: 'Every reader in his intended audience did know. The cellar at Samarra is
    a fixture of polemic against Twelver Shi''ism, repeated in argument for centuries,
    and it turns a doctrine about occultation into an image of people waiting at
    a hole in the ground. [[NEEDS CLAIM: the earliest polemical text that attributes
    the cellar belief to the Shia, and its date]].'
- template: body
  body: A denial is evidence about the accusation rather than about the doctrine.
    It tells a historian that the charge was live enough, and irritating enough,
    that a twentieth-century author writing a devotional life would break his own
    narrative to answer it. That is the useful fact on the page, and it can be reported
    without anyone taking a position on occultation itself.
- template: body
  body: 'This account does not adjudicate that question and will not. [[NEEDS CLAIM:
    what the earliest Imami sources say about the place of the reappearance]]. A
    stranger reading this carousel owes the tradition nothing and has no reason
    to accept a claim about the end of history from a picture on a phone. A slide
    that asks them to hold a belief before the sentence makes sense has failed the
    register rule this whole account is written under.'
- template: body
  body: What can be described is the argumentative move. Al-Qarashi compares the
    disappearance to the Prophet leaving Mecca for Yathrib while his house stood
    surrounded, with 'Ali sleeping in his bed. The comparison converts a metaphysical
    claim into a tactical one. A man in danger left, having arranged a substitute,
    and the watchers outside the door failed to notice until the morning. Stated
    that way, the story needs no metaphysics at all.
- template: body
  body: That is a rhetorical strategy with a long history and it is worth naming
    as one. Anchor the contested event to an uncontested event in the same tradition,
    and the reader's acceptance of the second does part of the work for the first.
    Whether the analogy holds is a question for a theologian. That it is being used
    is a question of reading.
- template: body
  body: 'Notice what the paragraph does not do. It cites nothing. No chain, no earlier
    author, no page number, no volume. The claim about what Shias have announced
    arrives as common knowledge, inside a book that carries footnotes elsewhere
    and uses them with some care. [[NEEDS CLAIM: whether al-Qarashi cites a source
    for the cellar denial anywhere in the volume]]. The absence is the interesting
    part of the page.'
- template: body
  body: 'An uncited paragraph in a cited book marks the line between what an author
    argues and what he assumes. Assumptions get no footnotes because the author
    cannot imagine anybody needing one. For a reader standing outside the tradition,
    those are the passages worth slowing down on: they show where the book expects
    agreement rather than persuasion, and agreement is where a community keeps its
    actual furniture.'
- template: body
  body: 'The translation adds a layer. The English on this shelf renders phrases
    like Master of the Age and the gate of the city of his knowledge, and each of
    those is a decision. [[NEEDS CLAIM: the translator of the Ansariyan edition
    of al-Qarashi''s Life of Imam al-Mahdi, from the title page]]. The manifest
    lists it as TODO, so nothing citing this book can be verified yet.'
- template: body
  body: 'Registering it matters more here than for a chronicle. A twentieth-century
    devotional work is a source for twentieth-century belief and argument, which
    is a real historical subject with dates of its own. [[NEEDS CLAIM: the year
    of publication of this volume]]. Without that year the book floats loose in
    time. A reader cannot tell which decade''s polemics it answers, or whose accusation
    it judged worth a paragraph of denial.'
- template: body
  body: 'That is the honest frame for a carousel about this page: a modern author,
    writing at a datable moment, answering a charge older than he is, in a book
    with no footnote at that point. Every element of that is checkable from the
    title page and the paragraph itself, and none of it requires a reader to hold
    any belief about the twelfth Imam.'
- template: closing
  body: The sentence a book writes without a footnote is the sentence it never expected
    to have to defend, and those are the ones that tell you who it thinks is listening.

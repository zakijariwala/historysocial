# The first essay. Sixteen slides on Musa b. Ja'far.
#
# Every factual assertion here is a placeholder, because no claim row in
# claims.db is verified yet. That is the correct state of this file, not a
# defect in it: a placeholder is output, an invented date is a build failure.
# tools/lint_post.py refuses to render a single slide while a placeholder
# remains, so this essay lives in the database and never reaches a PNG until
# the rows below are checked against the edition cited.
#
# The `claims` block holds CANDIDATE rows. Each names a source and a printed
# page that a search of the local corpus actually returned, so verifying one
# means opening the book at that page and reading the sentence. None of them
# is verified, and nothing in this pipeline can verify them except a person.

post:
  id: musa-bridge
  pillar: collision
  running_head: the imam who spent nineteen years in custody
  cover_title: the bridge at baghdad
  cover_image: met-449028
  ink: rust
  mourning: false
  status: draft
  caption: |
    Al-Sindi b. Shahik ran the prison where Musa b. Ja'far died. He did not
    bury the body. He walked the jurists of Baghdad past it, had them state
    that they saw no wound, then carried it to the bridge and invited the
    city to look at the face.

    A man does not stage a viewing to prove a death nobody doubts.

    Sources are named on the slides. Every figure traces to a page in the
    edition cited, and where the chronicles differ the slides say so.


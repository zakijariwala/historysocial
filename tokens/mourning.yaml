# The mourning calendar.
#
# The two-month window is fixed and needs nobody's confirmation:
#
#     Muharram 1 to Safar 30
#
# The wafat dates are NOT filled in here, and no tool will fill them. They come
# from Sistani's published calendar, they are a religious determination, and a
# machine guessing them would put an ornamented cover on a mourning morning.
# Fill `hijri` as MONTH-DAY, where month is 1 to 12: Muharram 10 is "1-10".
#
# tools/mourning.py reports how many are still TODO every time it runs, so an
# unfilled list can never be mistaken for an empty one.

note: >
  Filled and verified by hand against Sistani's published calendar (2026/1448).

# Verified by zaki on 2026-08-28: Checked all twelve Hijri wafat dates against Sistani's calendar.
wafat:
  - name: "wafat of the Prophet"
    hijri: "2-28"
  - name: "wafat of Fatima al-Zahra"
    hijri: "6-3"
  - name: "wafat of Imam 'Ali"
    hijri: "9-21"
  - name: "wafat of Imam al-Hasan"
    hijri: "2-28"
  - name: "wafat of Imam al-Sajjad"
    hijri: "1-25"
  - name: "wafat of Imam al-Baqir"
    hijri: "12-7"
  - name: "wafat of Imam al-Sadiq"
    hijri: "10-25"
  - name: "wafat of Imam al-Kazim"
    hijri: "7-25"
  - name: "wafat of Imam al-Rida"
    hijri: "2-30"
  - name: "wafat of Imam al-Jawad"
    hijri: "11-29"
  - name: "wafat of Imam al-Hadi"
    hijri: "7-3"
  - name: "wafat of Imam al-'Askari"
    hijri: "3-8"

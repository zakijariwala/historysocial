<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ post.id }} / {{ slide.position }}</title>
<style>
  /* Fonts load from disk, by absolute file:// path. Never from a network.
     Chromium in a GitHub runner ships no serif worth the name; a fetched
     font would silently fall back to boxes in an image nobody re-reads. */
  @font-face {
    font-family: "SerifBundled";
    src: url("{{ fonts.serif_regular }}") format("truetype");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "SerifBundled";
    src: url("{{ fonts.serif_italic }}") format("truetype");
    font-weight: 100 900;
    font-style: italic;
  }
  @font-face {
    font-family: "GrotesqueBundled";
    src: url("{{ fonts.grotesque_regular }}") format("truetype");
    font-weight: 100 900;
    font-style: normal;
  }

  :root {
    --ground: {{ ground }};
    --ink: {{ ink }};
    --margin: {{ tokens.canvas.margin }}px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: {{ tokens.canvas.width }}px;
    height: {{ tokens.canvas.height }}px;
    overflow: hidden;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "SerifBundled", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    font-kerning: normal;
    font-variant-ligatures: common-ligatures;
  }

  .slide { position: relative; width: 100%; height: 100%; }

  /* The running head brands any single slide somebody screenshots. It is on
     every interior slide, without exception, and the linter enforces that. */
  .running-head {
    position: absolute;
    top: var(--margin);
    left: var(--margin);
    right: var(--margin);
    font-style: italic;
    font-size: {{ tokens.type.running_head.size }}px;
    letter-spacing: {{ tokens.type.running_head.tracking }};
    opacity: {{ tokens.type.running_head.opacity }};
  }

  .position {
    position: absolute;
    bottom: var(--margin);
    right: var(--margin);
    font-style: italic;
    font-size: 26px;
    opacity: 0.5;
  }

  /* Every interior slide measures its text inside this box. The renderer
     compares scrollHeight against clientHeight here and FAILS the build when
     the text does not fit. Text never shrinks to fit: a slide that overflows
     is a slide that was written too long, and that is an editing problem. */
  .measure {
    position: absolute;
    left: var(--margin);
    right: var(--margin);
    top: calc(var(--margin) * 2.1);
    bottom: calc(var(--margin) * 1.6);
    overflow: hidden;
    display: flex;
  }

  {% block style %}{% endblock %}
</style>
</head>
<body>
<div class="slide">{% block slide %}{% endblock %}</div>
</body>
</html>

# STRESS: map pillar with almost no coordinates, halftone cover, 15 slides.

post:
  id: sample-23-tawaghit
  pillar: map
  running_head: a sanctuary that was one of several
  cover_title: the other temples
  cover_image: met-448960
  ink: indigo
  caption: 'Ibn Ishaq writes that alongside the Ka''ba the Arabs had tawaghit: temples

    they venerated the same way, with guardians and overseers, which they

    circled and sacrificed at.


    A map post with no coordinates on it, because the source gives none.

    '
claims:
- subject: Ibn Ishaq
  assertion: alongside the Ka'ba the Arabs had adopted tawaghit, temples which they
    venerated as they venerated the Ka'ba, with guardians and overseers, and they
    made offerings, circumambulated and sacrificed at them
  source: SRC-SIR-001
  locator: "p. 38"
- subject: Ibn Ishaq
  assertion: every household had an idol in the house which they worshipped, rubbed
    before a journey and rubbed again on returning
  source: SRC-SIR-001
  locator: "p. 38"
slides:
- template: cover
- template: question
  body: How many sanctuaries were there, and does any source on this shelf say where
    they stood?
- template: body
  body: Ibn Ishaq puts the whole system in three lines. Alongside the Ka'ba the
    Arabs had adopted tawaghit, which were temples they venerated the way they venerated
    the Ka'ba. Those temples had their guardians and overseers. People made offerings
    to them, circled them, and sacrificed at them. The verbs are the same verbs
    used of the Ka'ba, which is the point of the sentence and the reason it is worth
    a carousel. Nobody circles a shrine they think is minor.
- template: body
  body: 'Sameness of ritual implies a network rather than a hierarchy. A pilgrim
    who circles one shrine and sacrifices at another is moving through a landscape
    with several fixed points in it, and each point has staff who eat from the offerings.
    [[NEEDS CLAIM: how many tawaghit Ibn Ishaq names, and where the sira places
    them]]. Without those names this map has one certain location on it and an unknown
    number of blanks.'
- template: body
  body: A map post with blanks is still a map post, provided the blanks are drawn
    as blanks. The failure mode of this format is a clean line between two dots
    on a modern basemap, which tells a reader that somebody knows the route. Nobody
    on this shelf knows the route between the Meccan sanctuary and any of the others,
    because the source names neither the roads nor most of the shrines.
- template: body
  body: 'What the source does supply is scale at the domestic end. Every household
    had an idol in the house, Ibn Ishaq writes, and a man setting out on a journey
    rubbed himself against it before riding, and rubbed himself against it again
    on returning before going in to his family. That gives a third tier: household,
    local temple, and the sanctuary at Mecca.'
- template: body
  body: Three tiers is a structure a reader can hold, and it changes what the later
    argument is about. A message of one God arriving in that landscape is not only
    correcting a doctrine. It is removing a fixture from every house, a revenue
    stream from every temple staff, and the ritual that opened and closed every
    journey. Furniture is harder to argue with than doctrine, and it is what the
    objection reaches for.
- template: body
  body: Ibn Ishaq puts the objection in Quraysh's own words a line later. Would
    he make the gods into one God, they say, that is a strange proceeding. Read
    beside the household idols, that reads less like theology and more like a man
    being told the furniture is going. The compiler leaves the two sentences next
    to each other and adds nothing.
- template: body
  body: 'For a map post the useful question is where the guardians came from. [[NEEDS
    CLAIM: whether the sira names the clans holding the guardianship of any sanctuary
    besides the Ka''ba]]. Guardianship is heritable, local and lucrative, so the
    answer would locate several of these temples by naming the families who ran
    them, which is how ancient geography gets recovered. Guardianship is the thread
    that leads back to the temples named at the top of this essay.'
- template: body
  body: The Ka'ba itself is the one fixed point, and even its furniture gets named.
    Isaf and Na'ila are two stones with an origin story attached, and Abu Talib's
    verse in the same passage places them where the pilgrims make their camels kneel
    and the waters flow. That is a topographic detail inside a poem, and poems preserve
    topography better than prose does.
- template: body
  body: 'Where the pilgrims make their camels kneel is a real instruction. It tells
    you the stones stood at the point where a caravan stopped, which is the busiest
    and most valuable ground in any sanctuary. [[NEEDS CLAIM: what Guillaume''s
    notes say about the location of Isaf and Na''ila]]. A note there would turn
    a line of verse into a position on a plan.'
- template: body
  body: 'Yaqut would settle a good deal of this, and Yaqut is the gap in this corpus.
    The Wustenfeld edition downloaded from archive.org came back as unreadable OCR,
    so the standard geographical dictionary of the Arabic tradition sits on the
    shelf in a form nothing can search. [[NEEDS CLAIM: a usable text of Mu''jam
    al-buldan]]. The dictionary that would fill this map is a nineteenth century
    book, and the copy this pipeline fetched is unreadable.'
- template: body
  body: That single missing book is why this account has no distances in it. Not
    one carousel here states how far Medina lies from Mecca, or Basra from Baghdad,
    and every attempt to write such a sentence has produced a placeholder instead.
    A pipeline that renders placeholders as failures makes the shape of a missing
    source visible. That single missing dictionary is the reason every distance
    in this account is bracketed.
- template: body
  body: Visible is better than filled. A map slide with a blank on it invites a
    reader to ask what would fill it, and the answer here is one nineteenth century
    edition, in Arabic, with a text layer somebody can search. That is a specific,
    purchasable, solvable problem rather than a vague complaint about sources. A
    blank drawn as a blank is still a map, and it names the book that would finish
    it.
- template: closing
  body: The sanctuary at Mecca stands on this map because a poem happened to name
    the ground it sat on, and every other temple in the passage has no location
    at all. The temples in that sentence had staff, revenue and a location, and
    only the staff survive in the record.

# SAMPLE. scratch.db only. Candidate claims, none verified.

post:
  id: sample-08-shroud
  pillar: fact_panel
  running_head: the last instruction a prisoner gave
  cover_title: the shroud he refused
  cover_image: met-453385
  ink: iron
  caption: |
    Al-Sindi b. Shahik offered to shroud the body. Musa b. Ja'far refused him
    and named a retainer of his own household to do the washing instead. The
    refusal is recorded in the jailer's own voice, which is the strangest
    thing about it.

claims:
  - subject: Musa b. Ja'far
    assertion: >-
      al-Sindi reported that he asked permission to shroud him and was refused;
      the prisoner said that only a pure retainer of his own house could shroud
      the dead of the family, and named the man
    source: SRC-IRS-003
    locator: "p. 428"
  - subject: Musa b. Ja'far
    assertion: >-
      al-Sindi carried out the request
    source: SRC-IRS-003
    locator: "p. 428"

slides:
  - template: cover

  - template: question
    body: >-
      Why would a jailer preserve the story of a prisoner turning down his
      favour?

  - template: body
    body: >-
      Al-Mufid keeps the exchange in al-Sindi's own words. The jailer asked for
      permission to shroud the body and the prisoner refused him. Musa b. Ja'far
      told him that the dowries of the women of the household, the pilgrimages
      performed on behalf of its dead, and the shrouding of its dead could be
      handled by a retainer of the house and by nobody else. He named the man.
      Al-Sindi says he did as he was asked.

  - template: body
    body: >-
      Take the report at the level of procedure first. A prisoner in state
      custody issued an instruction about his own corpse, and the officer
      holding him carried it out. That is not the behaviour of a man disposing
      of an inconvenience. It is the behaviour of an official who knows that the
      household will inspect what he did and that his own name will be attached
      to the answer.

  - template: body
    body: >-
      Now take it as a source. The report reaches al-Mufid through al-Sindi.
      [[NEEDS CLAIM: the chain by which al-Sindi's account of the refusal was
      transmitted, Irshad p. 428]]. A story that makes the jailer look
      punctilious travels well in the jailer's own circle, and a story that
      shows the prisoner giving orders travels well in the other camp. This one
      served both, which is a decent reason for its survival.

  - template: body
    body: >-
      The content of the refusal is a rule about purity and about who belongs to
      a house. Musa b. Ja'far did not say that al-Sindi was unfit as a man. He
      said that a member of the family is washed by a retainer of the family.
      [[NEEDS CLAIM: the fiqh rule on who may wash and shroud the dead, and the
      earliest source for it]].

  - template: body
    body: >-
      A rule of that kind draws a line that a state cannot cross by force. The
      caliph could move this man from Medina to Basra to Baghdad, could hold him
      without a charge and could hand him from one custodian to another. He
      could not make his officer the person who prepared the body. The last
      jurisdiction left to a prisoner was three feet wide, and he used it.

  - template: body
    body: >-
      The refusal also carries an expectation. A man who names the retainer who
      will wash him expects to be washed, buried and mourned in the ordinary
      way. He is not arranging for a disappearance or for a return. Against the
      claim that this imam would not die at all, the instruction is evidence
      from the only witness who could not be accused of guessing.

  - template: body
    body: >-
      Nobody in the later argument seems to have used it that way, and the
      silence is worth a slide of its own.
      [[NEEDS CLAIM: whether any source cites the shroud instruction against the
      Waqifa]]. The controversy ran on lists of transmitters, on chains and on
      doctrine. This small procedural detail sat in the record with nobody
      reaching for it, which suggests the two sides were not arguing about
      evidence in the way a modern reader assumes they were.

  - template: body
    body: >-
      Al-Mufid places the passage after the viewing on the bridge and before the
      list of the thirty-seven children. Death, then proof of death, then the
      household that has to carry on. The chapter is arranged like a case file
      rather than like a life, and the shroud instruction is the document that
      closes the section on the body. What follows it is inheritance, and the
      compiler moves from one to the other without a paragraph of grief between
      them.

  - template: body
    body: >-
      Compare the Arabic chronicle one more time. Al-Tabari has the death, the
      city and the year, and carries nothing about a shroud, a retainer or a
      refusal, because none of that belongs in an annal.
      [[NEEDS CLAIM: whether any chronicle outside the Imami tradition records
      the burial arrangements]]. The detail survives because a community kept
      it, and a community keeps what it can use. Ask what this one was using it
      for and the answer is continuity.

  - template: body
    body: >-
      What they used it for was continuity. A retainer of the house washed the
      body, the house buried him in the graveyard of Quraysh, and the house went
      on with 'Ali b. Musa al-Rida at its head. Each of those is an
      administrative fact before it is anything else, and the chain of them is
      what a succession looks like from the outside.

  - template: closing
    body: >-
      The last order this prisoner gave was about a piece of cloth, and the
      officer who had spent months holding him obeyed it.

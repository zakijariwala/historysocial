# SAMPLE. scratch.db only. Candidate claims, none verified.

post:
  id: sample-02-shawwal
  pillar: date_pair
  running_head: two dates and the road between them
  cover_title: twenty shawwal
  cover_image: met-447809
  ink: iron
  caption: |
    Al-Kulayni gives a day, a month and a year for the summons that took Musa
    b. Ja'far out of Medina. He gives no day at all for the death. One end of
    the custody is dated to the afternoon. The other end is dated to a year.

claims:
  - subject: Musa b. Ja'far
    assertion: >-
      Harun summoned him from Medina on 20 Shawwal 179, took him to Basra after
      the hajj, and imprisoned him under 'Isa b. Ja'far
    hijri: 179
    source: SRC-KAF-001
    locator: "p. 451"
  - subject: Musa b. Ja'far
    assertion: >-
      al-Mufid dates the death to 6 Rajab 183 in the prison of al-Sindi b.
      Shahik, at the age of fifty-five
    hijri: 183
    source: SRC-IRS-003
    locator: "p. 407"

slides:
  - template: cover

  - template: question
    body: >-
      Why does the record keep the day a prisoner was taken and lose the day he
      arrived?

  - template: body
    body: >-
      The record keeps the day the escort took him. Al-Kulayni dates the summons
      out of Medina to the twentieth of Shawwal in 179: a day, a month and a
      year, which is the precision a chancery keeps and a memory does not. He
      places Harun at Medina on the return from the umra in Ramadan. The caliph
      then went on to the hajj and took Musa b. Ja'far with him toward Basra,
      where the arrival is dated to no day at all.

  - template: body
    body: >-
      Read that itinerary again. The prisoner travelled inside the caliph's own
      pilgrimage caravan. Harun did not send a squad to Medina to seize a man in
      the night and drag him to Iraq. He collected him on a journey the whole
      Hijaz could watch, and then continued to Basra, where 'Isa b. Ja'far took
      custody of him. The arrest wore the clothes of an escort.

  - template: body
    body: >-
      Al-Mufid supplies the other end. He dates the death to the sixth of Rajab
      in 183 and puts it in the prison of al-Sindi b. Shahik at Baghdad. He
      gives the age as fifty-five. Two compilers, working from different
      material, between them fix a span: Shawwal 179 to Rajab 183. Everything
      the account has to say about custody happens inside that window.

  - template: body
    body: >-
      The window runs to something under four years.
      [[NEEDS CLAIM: the exact interval between 20 Shawwal 179 and 6 Rajab 183
      in lunar months]]. That figure sits against the phrase which follows this
      man through every later retelling, the one that speaks of nineteen years
      in custody. Both numbers cannot describe the same thing. Either the
      shorter one counts the final imprisonment and the longer one counts a
      lifetime of detentions, or somebody has added two spans that overlap. No
      source on this shelf states which, and the difference is the whole claim.

  - template: body
    body: >-
      One count measures the last custody. The other count reaches back to
      earlier arrests under earlier caliphs, which is a much longer stretch and a
      much vaguer one. [[NEEDS CLAIM: the year of the first arrest under
      al-Mahdi, and who ordered it]]. Al-Kulayni preserves a report of Musa b.
      Ja'far being brought before al-Mahdi and halting at Zabala on the road, so
      the earlier detentions are not an invention of later devotion.

  - template: body
    body: >-
      The difference between four years and nineteen is the difference between a
      case and a career. A four-year custody is a political decision by one
      caliph. A nineteen-year pattern is a policy held by three of them across
      three reigns. Anyone who repeats the larger figure is making the second
      claim, and the arithmetic behind it has to be shown rather than inherited.

  - template: body
    body: >-
      A policy held across three reigns would leave traces in three kinds of
      record, and al-Kulayni's precision at the front end tells you what kind he
      had. A dated summons on the twentieth of Shawwal reads like a note taken
      from a register, or from somebody who watched the caravan leave Medina.
      His death notice carries no such day. Al-Mufid supplies one, working later
      and drawing on material that had settled inside the community by his time.

  - template: body
    body: >-
      The Arabic chronicle of al-Tabari enters the death without a day at all,
      under the year, beside the death of the qadi Muhammad b. al-Sammak.
      [[NEEDS CLAIM: the full wording of al-Tabari's notice at 8:271]]. For a
      chronicler working by years, a prisoner's death is one line in a list. The
      absence of a date is not concealment. It is the shape of the genre.

  - template: body
    body: >-
      So the two ends of this custody sit in different kinds of record, and the
      genre of a source decides what it can tell you. The beginning is
      administrative and dated to the day. The end reaches us twice: dated to
      the day by a compiler writing two centuries downstream, and dated to the
      year by a chronicler working from the state's own files. Choosing between
      those two is not possible from here. Naming which is which is.

  - template: body
    body: >-
      Naming which is which leaves one job. A date pair is only as strong as the
      weaker of its two dates, and both of these dates rest on a single book.
      Shawwal 179 rests on al-Kulayni alone in the material on this shelf. Rajab
      183 rests on al-Mufid alone. [[NEEDS CLAIM: whether any source earlier
      than al-Kafi carries the 20 Shawwal 179 summons]]. Until somebody checks
      that, the span is a claim about two compilers rather than a claim about
      four years.

  - template: closing
    body: >-
      The state wrote down the day it took him and the year it lost him, and
      that asymmetry is the whole administrative history of the case in two
      lines.

# The register of every volume this pipeline is allowed to cite.
#
# sources/ is gitignored. This file is the only part of it that is committed,
# because it is the only part that is not somebody else's text.
#
# HOW A FIELD BECOMES TRUE
#   Fields marked TODO were not filled in by the machine ON PURPOSE. Nothing
#   here may be inferred from a book's contents or from a model's memory. An
#   edition statement and an ISBN are bibliographic facts; a wrong one turns
#   every claim citing it into a false citation. Fill them from the copy in
#   your hand.
#
#   tools/db.py verify REFUSES to mark a claim verified when its source_key
#   points at a record whose `edition` still starts with "TODO".
#
# PAGINATION tells you what "p. 212" means for that volume:
#   print-edition   the number printed in a typeset print edition
#   ebook-reflowed  a number printed by an ebook conversion. Stable for this
#                   file, meaningless to a reader holding the paper book.
#   scan            page images, no reliable text layer
#
# LICENCE is recorded at registration, never assumed. `user-supplied` means
# the operator asserts a legal copy or permission. Those volumes stay local:
# they are never committed, never uploaded, never deployed to Pages.

version: 1

policy:
  fetchable:
    # tools/fetch_sources.py will only ever download from these.
    - openiti            # Arabic editions, CC-BY-SA / public domain
    - archive.org        # pre-1929 imprints only (de Goeje and the like)
  never_fetch:
    # In copyright. Register by hand from a copy you own.
    - "SUNY / State University of New York: The History of al-Tabari"
    - "Cambridge histories"
    - "Modarressi, Crisis and Consolidation"
    - "Pierce, Twelve Infallible Men"
    - "Dakake, The Charismatic Community"
    - "Oxford University Press: Guillaume, The Life of Muhammad"


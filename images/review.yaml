# The human-eye pass over the cover bank.
#
# tools/fetch_images.py rejects a candidate on what a museum's CATALOGUE RECORD
# says. That is a filter over metadata, and metadata lies by omission: an
# Egyptian Book of the Dead is catalogued as a papyrus, a Nigerian door board
# is catalogued as a door, and both of them carry a human face in the image.
#
# So every entry is looked at before it can be used. This file records that
# pass. tools/apply_review.py writes the decisions into images/bank.yaml and
# deletes the files of anything rejected, so a rejected image cannot be
# reached by a typo in a post row.
#
# reviewed_by: whoever ran their eye over the pixels. Change it to your own
# name when you re-review; the point of the field is that a person is on the
# hook for Rule 3, not a regex.

reviewed_by: "claude (opus 5), 2026-08-27 - pixels inspected, not metadata"

